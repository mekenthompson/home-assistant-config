- type: vertical-stack
  cards:
    #--------------------------------------#
    # Tab : Header Menu                    #
    #--------------------------------------#
    - type: horizontal-stack
      cards: !include ui-header-menu.yaml
    #--------------------------------------#
    # Tab : Cards                          #
    #--------------------------------------#
    - type: "custom:button-card"
      template: card_title
      name: Cooling
      label:
    #--------------------------------------#
    # All Cooling                          #
    #--------------------------------------#
    - type: vertical-stack
      cards:
        - type: "custom:button-card"
          template: card_graph
          entity: sensor.average_house_temperature
          variables:
            ulm_card_graph_color: "var(--google-blue)"
            ulm_card_graph_name: Average Temp
            ulm_card_graph_entity: sensor.average_house_temperature
            ulm_card_graph_type: fill
            ulm_card_graph_hours: 24
        - type: "custom:button-card"
          template: card_thermostat
          entity: climate.all_cooling
          variables:
            ulm_card_thermostat_enable_popup: false
            ulm_card_thermostat_enable_collapse: false
            ulm_card_thermostat_enable_controls: true
            ulm_card_thermostat_enable_hvac_modes: false
        # Sleep Timer - All Cooling
        - type: horizontal-stack
          cards:
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_status
              entity: timer.all_cooling_sleep
              variables:
                ulm_sleep_timer_name: "All"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.all_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "00:15:00"
                ulm_sleep_timer_label: "15m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.all_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "00:30:00"
                ulm_sleep_timer_label: "30m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.all_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "01:00:00"
                ulm_sleep_timer_label: "60m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_cancel
              entity: timer.all_cooling_sleep
        #--------------------------------------#
        # Living Cooling                       #
        #--------------------------------------#
        - type: horizontal-stack
          cards:
            - type: "custom:button-card"
              template: card_graph
              entity: sensor.ground_floor_temperature
              variables:
                ulm_card_graph_color: "var(--google-blue)"
                ulm_card_graph_name: Ground Floor
                ulm_card_graph_entity: sensor.ground_floor_temperature
                ulm_card_graph_type: fill
                ulm_card_graph_hours: 24
            - type: "custom:button-card"
              template: card_thermostat
              entity: climate.living_cooling
              variables:
                ulm_card_thermostat_enable_popup: false
                ulm_card_thermostat_enable_collapse: false
                ulm_card_thermostat_enable_controls: true
                ulm_card_thermostat_enable_hvac_modes: false
        # Sleep Timer - Living Cooling
        - type: horizontal-stack
          cards:
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_status
              entity: timer.living_cooling_sleep
              variables:
                ulm_sleep_timer_name: "Living"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.living_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "00:15:00"
                ulm_sleep_timer_label: "15m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.living_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "00:30:00"
                ulm_sleep_timer_label: "30m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_btn
              entity: timer.living_cooling_sleep
              variables:
                ulm_sleep_timer_duration: "01:00:00"
                ulm_sleep_timer_label: "60m"
            - type: "custom:button-card"
              template: custom_card_mekenthompson_sleep_timer_cancel
              entity: timer.living_cooling_sleep
    #--------------------------------------#
    # Office Cooling                       #
    #--------------------------------------#
    - type: vertical-stack
